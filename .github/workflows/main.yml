name: Extract LiveMate AI

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          ZIP="${{ steps.zip.outputs.file }}"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          cp -R extracted/. .
          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.file }}"

      - name: Commit extracted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract LiveMate AI source code"
          git push
