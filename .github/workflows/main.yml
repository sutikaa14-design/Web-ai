name: LiveMate AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "LiveMate AI project detected"
          test -f package.json
          test -f wrangler.jsonc
          test -f worker/index.ts
          echo "All required files are present"
