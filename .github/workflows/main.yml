name: Extract LiveMate AI

on:
  push:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP LiveMate tidak ditemukan"
            exit 1
          fi
          echo "ZIP: $ZIP"

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          mkdir -p temp_extract
          unzip -o "$ZIP" -d temp_extract
          cp -R temp_extract/. .
          rm -rf temp_extract

      - name: Remove ZIP
        run: |
          rm -f ./*.zip

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract LiveMate AI"
          git push
